@if (!url()) {
  <button
    type="button"
    class="section-image__placeholder"
    [disabled]="!editable()"
    (click)="editable() && openPicker()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
      <circle cx="9" cy="9" r="2" />
      <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
    </svg>
    <span>
      @if (editable()) {
        Click or drop to add {{ placeholder() }}
      } @else {
        {{ placeholder() }}
      }
    </span>
    @if (editable()) {
      <input
        #fileInput
        type="file"
        accept="image/png,image/jpeg,image/webp"
        hidden
        (change)="onFileChange($event)"
      />
    }
  </button>
} @else {
  <div class="section-image">
    <img
      [src]="url()"
      alt=""
      draggable="false"
      [style.object-fit]="objectFit()"
    />
    @if (editable()) {
      <div class="section-image__overlay">
        <button type="button" class="section-image__pill" (click)="openPicker()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            <path d="m15 5 4 4" />
          </svg>
          <span>Replace</span>
        </button>
        <button
          type="button"
          class="section-image__pill section-image__pill--danger"
          (click)="clear()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
          <span>Clear</span>
        </button>
      </div>
      <input
        #fileInput
        type="file"
        accept="image/png,image/jpeg,image/webp"
        hidden
        (change)="onFileChange($event)"
      />
    }
  </div>
}
