<div class="app-root" [class.is-dragging-file]="drag.isDraggingFile()" [style.--cover-aspect]="coverAspectVar()">
  @if (drag.isDraggingFile()) {
    <div class="app-root__drag-backdrop" aria-hidden="true"></div>
  }

  <header class="global-header">
    <h1>Disc Cover Generator</h1>
    <button
      type="button"
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.resolved() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [title]="theme.resolved() === 'dark' ? 'Light mode' : 'Dark mode'"
    >
      @if (theme.resolved() === 'dark') {
        <app-icon name="sun" [size]="20" />
      } @else {
        <app-icon name="moon" [size]="20" />
      }
    </button>
  </header>

  <aside class="form-panel">
    <app-cover-form (generate)="onGenerate()" />
  </aside>

  <main class="preview-panel">
    <h2>Live preview</h2>
    <div class="preview-panel--cover">
      @if (store.mode.kind() === 'single') {
        <app-cover-preview-single
          [preset]="store.activePreset()"
          [fit]="store.mode.fit()"
          [borderMode]="store.borders.mode()"
          [borderThicknessPx]="store.borders.thicknessPx()"
          [borderColor]="store.borders.color()"
          [fitBackground]="store.mode.fitBackground()"
          [imageUrl]="singleUrlView()"
          [isDraggingFile]="drag.isDraggingFile()"
          (fileSelected)="store.images.single.set($event)"
        />
      } @else {
        <app-cover-preview-separate-new [preset]="store.activePreset()" />
      }
    </div>
  </main>
</div>

<app-toast-container />
