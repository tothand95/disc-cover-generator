<div class="labels">
  {{ preset().totalWidthMm }} × {{ preset().heightMm }} mm
</div>

<div class="stage-container">
  <div
    #stage
    class="stage"
    [style.aspect-ratio]="aspect()"
    [style.box-shadow]="outerShadow()"
    [style.background]="store.images.fit() === 'fit' ? store.images.fitBackground() : 'var(--paper)'"
  >
    <div class="cell">
      <app-section-image [url]="store.images.singleUrl()" [fit]="store.images.fit()" placeholder="cover image" (fileChange)="store.images.singleFile.set($event)" />
      <app-drop-overlay [visible]="drag.isDraggingFile()" label="cover" (fileSelected)="store.images.singleFile.set($event)" />
    </div>
  </div>
</div>
