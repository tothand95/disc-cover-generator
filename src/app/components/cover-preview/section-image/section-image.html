@if (url()) {
  <div class="section-image">
    <img [src]="url()" alt="" draggable="false" [style.object-fit]="objectFit()" />
    @if (editable()) {
      <div class="section-image__overlay">
        <button type="button" class="section-image__pill" (click)="openPicker()">
          <app-icon name="pencil" [size]="14" />
          <span>Replace</span>
        </button>
        <button type="button" class="section-image__pill section-image__pill--danger" (click)="clear()">
          <app-icon name="trash" [size]="14" />
          <span>Clear</span>
        </button>
      </div>
      <input #fileInput type="file" accept="image/png,image/jpeg,image/webp" hidden (change)="onFileChange($event)" />
    }
  </div>
} @else {
  <button type="button" class="section-image__placeholder" [disabled]="!editable()" (click)="editable() && openPicker()">
    <app-icon name="image" [size]="24" [strokeWidth]="1.75" />
    <span>
      @if (editable()) {
        Click or drop to add {{ placeholder() }}
      } @else {
        {{ placeholder() }}
      }
    </span>
    @if (editable()) {
      <input #fileInput type="file" accept="image/png,image/jpeg,image/webp" hidden (change)="onFileChange($event)" />
    }
  </button>
}
