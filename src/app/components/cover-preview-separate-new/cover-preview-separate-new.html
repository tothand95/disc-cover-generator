<div class="labels">
  <span>Back · {{ sideMm().toFixed(1) }} × {{ preset().heightMm }} mm</span>
  <span>Spine · {{ preset().spineWidthMm }} mm</span>
  <span>Front · {{ sideMm().toFixed(1) }} × {{ preset().heightMm }} mm</span>
</div>

<div class="stage-container">
  <div class="stage" [style.aspect-ratio]="aspect()" [style.grid-template-columns]="gridCols()">
    <div class="cell cell--back">Back</div>
    <div class="cell cell--spine">Spine</div>
    <div class="cell cell--front">Front</div>
  </div>
</div>
